<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyiv Apartments Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="map_data.js"></script>
<script src="stores_data.js"></script>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#d9d9de; --panel:rgba(255,255,255,.97); --accent:#1a73e8; --hover:rgba(127,127,127,.14); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#a1a1a6; --line:#3a3a3c; --panel:rgba(28,28,30,.96); --accent:#5b9dff; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system, system-ui, sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; top:12px; left:56px; width:330px; max-width:calc(100vw - 80px); max-height:calc(100vh - 24px); overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,.15); box-sizing:border-box; }
  .panel h1 { font-size:15px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; }
  details { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; }
  summary { cursor:pointer; font-weight:600; list-style:none; display:flex; justify-content:space-between; }
  summary::after { content:'▾'; color:var(--muted); } details:not([open]) summary::after { content:'▸'; }
  input[type=search] { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--fg); font-size:14px; margin-top:6px; }
  .list { max-height:170px; overflow:auto; margin-top:4px; }
  .list > div { padding:4px 6px; border-radius:5px; display:flex; gap:6px; justify-content:space-between; align-items:center; }
  .list > div[data-i], .list > div[data-brand] { cursor:pointer; }
  .list > div[data-i]:hover, .list > div[data-brand]:hover { background:var(--hover); }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  label { display:block; margin-top:8px; font-size:12px; color:var(--muted); }
  .cats label { display:flex; align-items:center; gap:4px; margin-top:3px; }
  .cats label .num { margin-left:auto; }
  input[type=range] { width:100%; }
  .legend { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; }
  i.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; flex:none; }
  i.sq { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; flex:none; }
  .stats { margin-top:8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  button { font:inherit; font-size:13px; padding:5px 10px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center; }
  .kpi { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
  .kpi div { border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
  .kpi b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .kpi span { font-size:11px; color:var(--muted); }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; border-radius:12px; padding:2px 4px 2px 8px; margin:3px 3px 0 0; color:#fff; max-width:100%; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip button { padding:0 5px; border:0; background:transparent; color:#fff; font-size:13px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  h3 { font-size:12px; margin:10px 0 0; color:var(--muted); font-weight:600; }
  .leaflet-popup-content { font-size:13px; }
  .leaflet-popup-content b.n { font-size:20px; }
  .leaflet-popup-content .row button { font-size:12px; padding:3px 7px; }
  .picking #map { cursor:crosshair; }
  @media (max-width:600px) { .panel { left:8px; right:8px; top:auto; bottom:8px; width:auto; max-width:none; max-height:55vh; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>Квартири в будинках Києва</h1>
  <div class="sub">Квартири: municipal.kiev.ua · магазини та координати: © OpenStreetMap</div>
  <input id="q" type="search" placeholder="Пошук адреси, напр. Панча 11А" autocomplete="off">
  <div id="results" class="list"></div>

  <details id="secRadius" open>
    <summary>Радіус</summary>
    <div class="row">
      <button id="pick">📍 Обрати центр на мапі</button>
      <button id="clearR">Скинути</button>
    </div>
    <div class="hint">Натисніть кнопку і клацніть на мапі, або «Радіус звідси» у картці будинку чи магазину. Центр можна перетягувати.</div>
    <label>Радіус: <b id="rv">500</b> м</label>
    <input id="r" type="range" min="100" max="5000" step="50" value="500">
    <div id="rstats"></div>
  </details>

  <details id="secStores" open>
    <summary>Конкуренти: продуктові магазини</summary>
    <label><input id="showStores" type="checkbox" checked> показувати магазини</label>
    <div class="cats" id="cats"></div>
    <input id="bq" type="search" placeholder="Підсвітити мережу: АТБ, Сільпо, Фора…" autocomplete="off">
    <div id="bresults" class="list"></div>
    <div id="chips"></div>
    <label><input id="onlyHl" type="checkbox"> показувати лише підсвічені мережі</label>
  </details>

  <details id="secFilter">
    <summary>Фільтри будинків</summary>
    <label>Квартир від <b id="minv">0</b> до <b id="maxv">будь-яка</b></label>
    <input id="min" type="range" min="0" max="500" step="10" value="0">
    <input id="max" type="range" min="10" max="1000" step="10" value="1000">
    <label><input id="approx" type="checkbox" checked> показувати приблизні координати</label>
    <label><input id="nodata" type="checkbox"> показувати будинки без даних</label>
  </details>
  <div class="legend" id="legend"></div>
  <div class="stats" id="stats"></div>
</div>
<script>
const B = (window.BUILDINGS || []).map(([lat,lon,street,house,org,apts,date,m], i) => ({i,lat,lon,street,house,org,apts,date,m}));
const S = (window.STORES || []).map(([lat,lon,name,brand,cat], i) => ({i,lat,lon,name,brand,cat}));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('uk');
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
function downloadCsv(name, rows) {
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], { type:'text/csv' });
  const a = Object.assign(document.createElement('a'), { href:URL.createObjectURL(blob), download:name });
  a.click(); URL.revokeObjectURL(a.href);
}

// ---------- building colours ----------
const BINS = [[0,'#9e9e9e','немає даних'],[1,'#4caf50','1–20'],[21,'#cddc39','21–60'],[61,'#ffc107','61–120'],[121,'#ff7043','121–250'],[251,'#d32f2f','250+']];
const binColor = a => a == null ? BINS[0][1] : BINS.slice(1).reduce((c,[lo,col]) => a >= lo ? col : c, BINS[1][1]);

// ---------- stores: categories & highlighted brands ----------
const STORE_COLOR = '#5e35b1';
const HL_COLORS = ['#d81b60','#1e88e5','#f4511e','#00897b','#8e24aa','#6d4c41','#3949ab','#c0ca33','#00acc1','#e53935'];
const CATS = [...S.reduce((m, s) => m.set(s.cat, (m.get(s.cat) || 0) + 1), new Map())].sort((a, b) => b[1] - a[1]);
const DEFAULT_CATS = ['Супермаркет','Продукти / мінімаркет','Гіпермаркет / універмаг','Ринок'];
let catsOn = new Set(store.get('kam-cats', DEFAULT_CATS));
let hl = store.get('kam-brands', []);
const BRANDS = [...S.reduce((m, s) => s.brand ? m.set(s.brand, (m.get(s.brand) || 0) + 1) : m, new Map())].sort((a, b) => b[1] - a[1]);
hl = hl.filter(b => BRANDS.some(([x]) => x === b));
const hlColor = b => HL_COLORS[hl.indexOf(b) % HL_COLORS.length];
$('cats').innerHTML = CATS.map(([c, n]) => `<label><input type="checkbox" data-cat="${esc(c)}" ${catsOn.has(c) ? 'checked' : ''}> ${esc(c)} <span class="num">${fmt(n)}</span></label>`).join('');
$('cats').addEventListener('change', e => {
  const c = e.target.dataset.cat; if (!c) return;
  e.target.checked ? catsOn.add(c) : catsOn.delete(c); store.set('kam-cats', [...catsOn]); render();
});
function toggleBrand(b, on) {
  hl = hl.filter(x => x !== b); if (on) hl.push(b);
  store.set('kam-brands', hl); renderChips(); render();
}
function renderChips() {
  $('chips').innerHTML = hl.map(b => `<span class="chip" style="background:${hlColor(b)}"><span>${esc(b)}</span><button data-brand="${esc(b)}" title="Прибрати">✕</button></span>`).join('');
}
$('chips').onclick = e => { const b = e.target.closest('button[data-brand]'); if (b) toggleBrand(b.dataset.brand, false); };
$('bq').addEventListener('input', e => {
  const w = e.target.value.toLowerCase().trim();
  const hits = w ? BRANDS.filter(([b]) => b.toLowerCase().includes(w)).slice(0, 30) : [];
  $('bresults').innerHTML = hits.map(([b, n]) => `<div data-brand="${esc(b)}"><span>${hl.includes(b) ? '✓ ' : ''}${esc(b)}</span><span class="num">${fmt(n)}</span></div>`).join('')
    || (w ? '<div class="hint">Не знайдено</div>' : '');
});
$('bresults').onclick = e => { const d = e.target.closest('[data-brand]'); if (d) { toggleBrand(d.dataset.brand, !hl.includes(d.dataset.brand)); $('bq').dispatchEvent(new Event('input')); } };

// ---------- map ----------
const map = L.map('map', { preferCanvas:true }).setView([50.45, 30.52], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap contributors' }).addTo(map);
const bLayer = L.layerGroup().addTo(map), sLayer = L.layerGroup().addTo(map);
const MATCH = { e:'точна адреса', b:'приблизно (основний номер)', s:'дуже приблизно (центр вулиці)' };
const bPopup = b => `<div>${esc(b.street)}, ${esc(b.house)}</div>
  <div><b class="n">${b.apts ?? '—'}</b> квартир</div>
  <div style="color:#888">${esc(b.org)}${b.date ? '<br>паспорт ' + esc(b.date) : ''}<br>${MATCH[b.m]}</div>
  <div class="row"><button data-act="radius" data-ll="${b.lat},${b.lon}">◎ Радіус звідси</button></div>`;
const sPopup = s => `<div><b>${esc(s.name || s.brand || 'Магазин')}</b></div>
  <div style="color:#888">${esc(s.cat)}${s.brand && s.brand !== s.name ? ' · ' + esc(s.brand) : ''}</div>
  <div class="row"><button data-act="radius" data-ll="${s.lat},${s.lon}">◎ Радіус звідси</button>
  ${s.brand ? `<button data-act="brand" data-brand="${esc(s.brand)}">${hl.includes(s.brand) ? 'Зняти підсвітку' : 'Підсвітити мережу'}</button>` : ''}</div>`;
B.forEach(b => {
  b.marker = L.circleMarker([b.lat, b.lon], { radius:3 }).bindPopup(() => bPopup(b));
  b.key = (b.street + ' ' + b.house).toLowerCase().replace(/[^0-9a-zа-яіїєґ']+/g, ' ');
});
S.forEach(s => { s.marker = L.circleMarker([s.lat, s.lon], { radius:4 }).bindPopup(() => sPopup(s)); });
map.on('popupopen', e => e.popup.getElement().querySelectorAll('button[data-act]').forEach(btn => btn.onclick = () => {
  if (btn.dataset.act === 'radius') { map.closePopup(); map.stop(); setTimeout(() => setCenter(btn.dataset.ll.split(',').map(Number)), 50); }
  if (btn.dataset.act === 'brand') { toggleBrand(btn.dataset.brand, !hl.includes(btn.dataset.brand)); map.closePopup(); }
}));

// keep fitted areas clear of the side panel (desktop) or bottom sheet (mobile)
const panelPad = () => { const p = document.querySelector('.panel').getBoundingClientRect();
  return innerWidth > 600 ? { paddingTopLeft:[p.right + 20, 20], paddingBottomRight:[20, 20] }
                          : { paddingTopLeft:[20, 20], paddingBottomRight:[20, innerHeight - p.top + 20] }; };

// ---------- radius ----------
let center = null, circle = null, centerMarker = null, picking = false;
const dist = (a, b) => map.distance(a, b);
function setCenter(ll) {
  center = L.latLng(ll);
  if (!circle) {
    circle = L.circle(center, { radius:+$('r').value, color:'#1a73e8', weight:2, fillOpacity:.06, interactive:false }).addTo(map);
    centerMarker = L.marker(center, { draggable:true, title:'Перетягніть центр' }).addTo(map);
    centerMarker.on('drag', e => { center = e.latlng; circle.setLatLng(center); render(); });
  } else { circle.setLatLng(center); centerMarker.setLatLng(center); }
  circle.setRadius(+$('r').value);
  const fit = () => map.fitBounds(circle.getBounds(), panelPad());
  map._animatingZoom ? map.once('zoomend', () => setTimeout(fit, 0)) : fit();   // don't fight a running zoom
  stopPicking(); render();
}
function clearCenter() {
  center = null; if (circle) { circle.remove(); centerMarker.remove(); circle = centerMarker = null; }
  render();
}
function stopPicking() { picking = false; $('pick').classList.remove('on'); document.body.classList.remove('picking'); }
$('pick').onclick = () => { picking = !picking; $('pick').classList.toggle('on', picking); document.body.classList.toggle('picking', picking); };
$('clearR').onclick = clearCenter;
map.on('click', e => { if (picking) setCenter(e.latlng); });
$('r').addEventListener('input', () => { $('rv').textContent = fmt(+$('r').value); if (circle) circle.setRadius(+$('r').value); render(); });

function radiusStats(inB, inS) {
  if (!center) { $('rstats').innerHTML = ''; return; }
  const withData = inB.filter(b => b.apts != null);
  const apts = withData.reduce((s, b) => s + b.apts, 0);
  const nearest = inS.length ? Math.min(...inS.map(s => s.d)) : null;
  const byBrand = new Map();
  for (const s of inS) { const k = s.brand || '(без мережі)'; byBrand.set(k, (byBrand.get(k) || 0) + 1); }
  const brands = [...byBrand].sort((a, b) => b[1] - a[1]);
  const hlN = inS.filter(s => hl.includes(s.brand)).length;
  $('rstats').innerHTML = `
    <div class="kpi">
      <div><b>${fmt(inB.length)}</b><span>будинків (з даними ${fmt(withData.length)})</span></div>
      <div><b>${fmt(apts)}</b><span>квартир</span></div>
      <div><b>${fmt(inS.length)}</b><span>магазинів-конкурентів${hl.length ? ` (підсвічених ${fmt(hlN)})` : ''}</span></div>
      <div><b>${inS.length ? fmt(Math.round(apts / inS.length)) : '—'}</b><span>квартир на 1 магазин</span></div>
      <div><b>${nearest == null ? '—' : fmt(Math.round(nearest)) + ' м'}</b><span>до найближчого магазину</span></div>
      <div><b>${withData.length ? fmt(Math.round(apts / withData.length)) : '—'}</b><span>квартир на будинок</span></div>
    </div>
    ${inS.length ? `<h3>Магазини в радіусі (клацніть мережу, щоб підсвітити)</h3>
    <div class="list" id="rbrands">${brands.map(([b, n]) => `<div ${b !== '(без мережі)' ? `data-brand="${esc(b)}"` : ''}>
      <span>${hl.includes(b) ? `<i class="sq" style="background:${hlColor(b)}"></i>` : ''}${esc(b)}</span><span class="num">${fmt(n)}</span></div>`).join('')}</div>` : ''}
    <div class="row"><button id="csvB">⬇ CSV будинків</button><button id="csvS">⬇ CSV магазинів</button></div>`;
  $('rbrands')?.addEventListener('click', e => { const d = e.target.closest('[data-brand]'); if (d) toggleBrand(d.dataset.brand, !hl.includes(d.dataset.brand)); });
  const R = $('r').value;
  $('csvB').onclick = () => downloadCsv(`budynky_${R}m.csv`, [['вулиця','будинок','організація','квартир','відстань_м','lat','lon']]
      .concat(inB.map(b => [b.street, b.house, b.org, b.apts ?? '', Math.round(b.d), b.lat, b.lon])));
  $('csvS').onclick = () => downloadCsv(`magazyny_${R}m.csv`, [['назва','мережа','категорія','відстань_м','lat','lon']]
      .concat([...inS].sort((a, b) => a.d - b.d).map(s => [s.name, s.brand, s.cat, Math.round(s.d), s.lat, s.lon])));
}

// ---------- main render ----------
function render() {
  const min = +$('min').value, max = +$('max').value, approx = $('approx').checked, nodata = $('nodata').checked;
  $('minv').textContent = min; $('maxv').textContent = max >= 1000 ? 'будь-яка' : max;
  const R = +$('r').value, faded = !!center;
  bLayer.clearLayers(); sLayer.clearLayers();
  let n = 0, sum = 0; const inB = [], inS = [];
  for (const b of B) {
    const ok = (b.apts == null ? nodata && min === 0 : b.apts >= min && (max >= 1000 || b.apts <= max)) && (approx || b.m === 'e');
    if (!ok) continue;
    b.d = center ? dist(center, [b.lat, b.lon]) : 0;
    const inR = center && b.d <= R; if (inR) inB.push(b);
    b.marker.setRadius(b.apts ? Math.min(3 + Math.sqrt(b.apts) / 2, 12) : 3);
    b.marker.setStyle({ color:'#0004', weight:1, fillColor:binColor(b.apts),
      fillOpacity: faded && !inR ? .15 : (b.m === 'e' ? .8 : .4), dashArray: b.m === 'e' ? null : '2 2' });
    bLayer.addLayer(b.marker); n++; sum += b.apts || 0;
  }
  let ns = 0;
  if ($('showStores').checked) for (const s of S) {
    const isHl = hl.includes(s.brand);
    if (!catsOn.has(s.cat) && !isHl) continue;
    if ($('onlyHl').checked && hl.length && !isHl) continue;
    s.d = center ? dist(center, [s.lat, s.lon]) : 0;
    const inR = center && s.d <= R; if (inR) inS.push(s);
    s.marker.setRadius(isHl ? 7 : 4.5);
    s.marker.setStyle({ color:'#fff', weight: isHl ? 2.5 : 1.5, fillColor: isHl ? hlColor(s.brand) : STORE_COLOR,
      fillOpacity: faded && !inR ? .3 : 1 });
    sLayer.addLayer(s.marker); ns++;
  }
  S.forEach(s => hl.includes(s.brand) && sLayer.hasLayer(s.marker) && s.marker.bringToFront());
  $('stats').textContent = `${fmt(n)} будинків · ${fmt(sum)} квартир · ${fmt(ns)} магазинів на мапі`;
  $('legend').innerHTML = BINS.map(([,c,l]) => `<span><i class="dot" style="background:${c}"></i>${l}</span>`).join('')
    + `<span><i class="dot" style="background:${STORE_COLOR};outline:2px solid #fff"></i>магазин</span>`
    + hl.map(b => `<span><i class="dot" style="background:${hlColor(b)};outline:2px solid #fff"></i>${esc(b)}</span>`).join('');
  radiusStats(inB, inS);
}
['min','max','approx','nodata','showStores','onlyHl'].forEach(id => $(id).addEventListener('input', render));

// ---------- address search ----------
$('q').addEventListener('input', e => {
  const words = e.target.value.toLowerCase().replace(/[^0-9a-zа-яіїєґ']+/g, ' ').trim().split(' ').filter(Boolean);
  const hits = words.length ? B.filter(b => words.every(w => b.key.includes(w))).slice(0, 30) : [];
  $('results').innerHTML = hits.map(b => `<div data-i="${b.i}"><span>${esc(b.street)}, ${esc(b.house)}</span><b class="num">${b.apts ?? '—'}</b></div>`).join('')
    || (words.length ? '<div class="hint">Не знайдено</div>' : '');
});
$('results').addEventListener('click', e => {
  const d = e.target.closest('[data-i]'); if (!d) return;
  const b = B[+d.dataset.i];
  if (!bLayer.hasLayer(b.marker)) bLayer.addLayer(b.marker);
  map.setView([b.lat, b.lon], 17); b.marker.openPopup();
});

renderChips(); render();
</script>
</body>
</html>
